# Campus Köthen – News & Events
# Start:   cp .env.example .env && docker compose up -d
# Update:  docker compose pull && docker compose up -d
# Lokal bauen: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

services:
  web:
    image: ghcr.io/erikenglerdev/campus-app-news-feed-website:${IMAGE_TAG:-latest}
    container_name: campus-koethen-news
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-https://campus-koethen-api.sturahsa.de}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0755
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
